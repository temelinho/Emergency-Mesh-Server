spring.application.name=EmergencyMeshServer

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/emergencymesh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:*}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.emergencymesh=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# Swagger UI
springdoc.swagger-ui.path=/admin-panel

# AI Service Configuration
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8030/predict}
